name: Product validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Install dependencies
        run: npm ci

      - name: Validate design profile
        run: npm run validate:profile

      - name: Validate product kit contract
        run: npm run test:product-kit

      - name: Validate analytics provider contract
        run: npm run test:analytics

      - name: Typecheck Astro project
        run: npm run typecheck

      - name: Validate launch kit
        run: npm run validate:launch-kit

      - name: Build and record static evidence
        shell: bash
        env:
          # Validation origin only. Public deployment requires its own explicit origin.
          PUBLIC_SITE_URL: https://backintel.example.invalid
          PUBLIC_SITE_MODE: preview
        run: |
          set +e
          npm run build > artifacts/validation/astro-build.log 2>&1
          build_exit=$?
          node scripts/record-build-evidence.mjs "$build_exit"
          exit "$build_exit"

      - name: Install Chrome matching Puppeteer
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { PUPPETEER_REVISIONS } from 'puppeteer-core';
          import { Browser, install } from '@puppeteer/browsers';
          const browser = await install({
            browser: Browser.CHROME,
            buildId: PUPPETEER_REVISIONS.chrome,
            cacheDir: join(process.env.RUNNER_TEMP, 'BackIntelChrome'),
          });
          appendFileSync(process.env.GITHUB_ENV, `CHROME_PATH=${browser.executablePath}\n`);
          JS

      - name: Check recorded BackIntel walkthrough
        env:
          PUBLIC_SITE_URL: https://backintel.example.invalid
          PUBLIC_SITE_MODE: preview
        run: node scripts/check-backintel-page.mjs
      - name: Run Lighthouse CI against preview build
        run: npm run lighthouse:ci

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/validation/
          if-no-files-found: error
