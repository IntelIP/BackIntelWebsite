name: Product validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Install dependencies
        run: npm ci

      - name: Validate design profile
        run: npm run validate:profile

      - name: Validate product kit contract
        run: npm run test:product-kit

      - name: Validate analytics provider contract
        run: npm run test:analytics

      - name: Typecheck Astro project
        run: npm run typecheck

      - name: Validate launch kit
        run: npm run validate:launch-kit

      - name: Build and record static evidence
        shell: bash
        run: |
          set +e
          npm run build > artifacts/validation/astro-build.log 2>&1
          build_exit=$?
          node scripts/record-build-evidence.mjs "$build_exit"
          exit "$build_exit"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/validation/
          if-no-files-found: error
